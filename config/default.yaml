# Runtime defaults — see docs/SPEC.md §5 for what each chunking value means.
# Every field here is also editable live from the control panel while the
# app is running; this file only sets what it starts with.

chunking:
  silence_threshold_ms: 600
  settle_buffer_ms: 200
  max_chunk_duration_s: 10.0
  min_chunk_duration_s: 1.2
  mt_context_window: 2

display:
  font_family: "Georgia, 'Times New Roman', serif"
  font_size_px: 56
  text_color: "#f5f5f0"
  background_color: "#000000"
  max_lines: 4
  show_live_indicator: true

pipeline:
  source_language: en
  target_language: es
  whisper_model_size: small.en
  mt_vendor: claude
  audio_device_index: null
  glossary: {}
