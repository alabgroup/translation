<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ language }} subtitles</title>
<link href="/static/fonts/lora.css" rel="stylesheet">
<style>
  /* The page stays transparent so the right half of the canvas shows the
     video feed in OBS. Only the subtitle panel paints a background. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
{% if preview %}
  /* Loaded in the control page's preview pane. A transparent document inside
     an iframe renders as white, so stand in for the video with a soft dark
     wash - never sent to OBS. */
  html, body {
    background:
      radial-gradient(120% 90% at 78% 18%, #23252b 0%, transparent 60%),
      linear-gradient(160deg, #17181c 0%, #0e0f12 100%);
  }
{% endif %}
  /* Left half of the canvas, full height. Newest line sits at the bottom and
     older lines stack upward, so the reader's eye stays in one place. */
  #panel {
    position: absolute;
    left: 0;
    top: 0;
    width: 50vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }
  #subtitles {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    padding: 3vh 2vw;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    gap: 0.35em;
    overflow: hidden;
    /* Fade the topmost line into the panel over roughly one line, so lines
       dissolve as they age out instead of ending on a hard edge. */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.5em);
    mask-image: linear-gradient(to bottom, transparent 0, #000 1.5em);
    /* CJK faces follow Lora so Chinese renders with real glyphs - Lora has no
       Chinese coverage and would otherwise fall back to boxes. Songti is the
       serif companion to Lora on macOS; PingFang is the sans fallback. */
    font-family: "Lora", Georgia, "Times New Roman", serif,
                 "Songti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei";
    font-size: 4.4vh;
    font-weight: 600;
    line-height: 1.34;
    letter-spacing: 0.004em;
    text-align: left;
    color: #fff;
  }
  .line {
    max-width: 100%;
    animation: fade-in 220ms ease-out;
    /* The older/newest crossfade. The slide-up itself is a Web Animation
       (see script), not a transition - a transition needs the browser to
       paint the "before" state first, which isn't guaranteed inside one
       synchronous render pass. */
    transition: opacity 320ms ease;
  }
  .line.gap-before { margin-top: 1.15em; }
  /* Older lines recede so the newest is easiest to read. */
  .line.older { opacity: 0.52; font-weight: 500; }
  .line.newest { opacity: 1; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(0.3em); }
    to   { opacity: 1; transform: none; }
  }
  /* Only visible when the page is opened in a normal browser tab, not in OBS. */
  #picker {
    position: absolute;
    top: 0;
    left: 0;
    padding: 0.5rem 0.75rem;
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    border-bottom-right-radius: 6px;
    opacity: 0;
    transition: opacity 150ms;
  }
  #picker:hover, #picker:focus-within { opacity: 1; }
</style>
</head>
<body>
<div id="picker">
  <label>Language
    <select id="language-select"></select>
  </label>
</div>
<div id="panel"><div id="subtitles"></div></div>
<script>
  // "active" means follow whatever the control page selected.
  const PINNED = {{ language | tojson }};
  const FOLLOW_ACTIVE = PINNED === "active";
  // Display settings arrive with each poll, so the control page can change
  // them mid-service without a reload.
  let visibleLines = 8;
  let clearAfterMs = 12000;

  const container = document.getElementById("subtitles");
  const select = document.getElementById("language-select");
  let lastRevision = -1;
  let currentLanguage = FOLLOW_ACTIVE ? null : PINNED;
  let knownLanguages = [];

  function textFor(line, language) {
    return language === "Source" ? line.source : (line.translations || {})[language];
  }

  // Reuse the DOM node for a line that is already on screen. Rebuilding every
  // node replays the fade-in animation on all of them at once, which reads as
  // the whole panel flashing - and with several overlays open, as the screen
  // flickering. Only genuinely new lines are created and animated.
  let rendered = new Map();   // line id -> element

  function render(lines, language) {
    const recent = lines.slice(-visibleLines)
      .map(line => ({id: line.id, text: textFor(line, language) || "", gap: !!line.paragraph_break}))
      .filter(line => line.text);

    // Record where every currently-rendered line sits before anything
    // changes, so the "push up" from a new line can be animated instead of
    // letting the flex layout jump straight to its new position.
    const firstRects = new Map();
    for (const node of container.children) firstRects.set(node, node.getBoundingClientRect());

    const next = new Map();
    const seen = new Set();
    const nodes = recent.map((line, i) => {
      let node = rendered.get(line.id);
      const isNew = !node;
      if (isNew) {
        node = document.createElement("div");
        node.textContent = line.text;
      } else if (node.textContent !== line.text) {
        // Same line, different language: swap the text without re-animating.
        node.textContent = line.text;
      }
      // A long pause before this line reads as a paragraph break - extra
      // space instead of stacking it flush against unrelated speech.
      const wanted = (i < recent.length - 1 ? "line older" : "line newest")
        + (line.gap ? " gap-before" : "");
      if (node.className !== wanted) node.className = wanted;
      next.set(line.id, node);
      seen.add(node);
      return node;
    });

    // Only touch the DOM for lines that actually enter or leave. Existing
    // nodes keep their identity - removing and reinserting them (the old
    // replaceChildren approach) restarts their fade-in animation, which is
    // what made every new line flash the whole panel instead of just itself.
    const current = [...container.children];
    const same = current.length === nodes.length
      && current.every((node, i) => node === nodes[i]);
    if (!same) {
      for (const node of current) if (!seen.has(node)) node.remove();
      for (const node of nodes) if (node.parentNode !== container) container.appendChild(node);
    }
    rendered = next;

    // Slide persisted lines from their old position to the new one. This
    // uses the Web Animations API rather than a CSS transition, because a
    // transition needs the browser to actually paint the "before" position
    // first - not guaranteed inside one synchronous render pass, and in
    // practice it never painted it, so lines jumped instead of sliding.
    // animate() takes explicit start/end keyframes, so it always plays.
    for (const node of nodes) {
      const first = firstRects.get(node);
      if (!first) continue;   // brand new - its own fade-in handles this instead
      const last = node.getBoundingClientRect();
      const delta = first.top - last.top;
      if (Math.abs(delta) > 0.5) {
        node.animate(
          [{transform: `translateY(${delta}px)`}, {transform: "none"}],
          {duration: 320, easing: "ease-out"},
        );
      }
    }

    // The panel is bottom-anchored with overflow hidden, so anything taller
    // than the canvas gets sliced through the middle of the oldest line.
    // Drop whole lines from the top until what remains fits, keeping the
    // newest line even if it alone overflows.
    while (container.scrollHeight > container.clientHeight
           && container.childElementCount > 1) {
      const dropped = container.firstElementChild;
      container.removeChild(dropped);
      for (const [id, node] of rendered) if (node === dropped) rendered.delete(id);
    }
  }

  function syncPicker(languages, active) {
    if (languages.join("|") !== knownLanguages.join("|")) {
      knownLanguages = languages;
      select.replaceChildren(...languages.map(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        return option;
      }));
    }
    if (document.activeElement !== select) select.value = active;
  }

  select.addEventListener("change", async () => {
    const language = select.value;
    if (FOLLOW_ACTIVE) {
      // Switch the shared selection so the OBS overlay follows too.
      await fetch("/api/active", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({language}),
      }).catch(() => {});
    } else {
      currentLanguage = language;
      lastRevision = -1;
    }
  });

  let lastChangeAt = Date.now();
  let lastLineId = null;
  let polling = false;

  async function poll() {
    if (polling) return;   // Don't let a slow response stack up out of order.
    polling = true;
    try {
      const res = await fetch("/api/lines", {cache: "no-store"});
      const data = await res.json();
      const language = FOLLOW_ACTIVE ? data.active : currentLanguage;
      syncPicker(data.languages || [], language);

      const s = data.settings || {};
      if (s.FONT_SIZE_VH) container.style.fontSize = s.FONT_SIZE_VH + "vh";
      if (s.VISIBLE_LINES && s.VISIBLE_LINES !== visibleLines) visibleLines = s.VISIBLE_LINES;
      if (s.CLEAR_SUBTITLES_AFTER_SECONDS !== undefined)
        clearAfterMs = s.CLEAR_SUBTITLES_AFTER_SECONDS * 1000;

      // The countdown to blanking measures silence, so only actual new speech
      // restarts it - not a language switch or a settings change, both of
      // which also bump the revision.
      const newestId = data.lines.length ? data.lines[data.lines.length - 1].id : null;
      if (newestId !== lastLineId) {
        lastLineId = newestId;
        lastChangeAt = Date.now();
      }

      if (data.revision !== lastRevision || language !== currentLanguage) {
        lastRevision = data.revision;
        currentLanguage = language;
        render(data.lines, language);
      } else if (clearAfterMs > 0
                 && container.childElementCount
                 && Date.now() - lastChangeAt > clearAfterMs) {
        container.replaceChildren();
        rendered = new Map();
      }
    } catch (err) {
      /* Server restarting - keep the last frame on screen and retry. */
    } finally {
      polling = false;
    }
  }

  poll();
  setInterval(poll, 400);
</script>
</body>
</html>
