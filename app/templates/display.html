<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ language }} subtitles</title>
<style>
  /* Transparent background so OBS composites this over the video feed. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #subtitles {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4vh;
    padding: 0 5vw;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 0.4em;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 4.2vh;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
  }
  .line {
    background: rgba(0, 0, 0, 0.55);
    padding: 0.25em 0.7em;
    border-radius: 0.3em;
    max-width: 100%;
    animation: fade-in 220ms ease-out;
  }
  /* Older lines recede so the newest is easiest to read. */
  .line.older { opacity: 0.55; font-size: 0.85em; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(0.3em); }
    to   { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div id="subtitles"></div>
<script>
  const LANGUAGE = {{ language | tojson }};
  const VISIBLE_LINES = 2;
  const container = document.getElementById("subtitles");
  let lastRevision = -1;

  function textFor(line) {
    return LANGUAGE === "Source" ? line.source : (line.translations || {})[LANGUAGE];
  }

  function render(lines) {
    const recent = lines.slice(-VISIBLE_LINES);
    container.replaceChildren(...recent.map((line, i) => {
      const div = document.createElement("div");
      div.className = i < recent.length - 1 ? "line older" : "line";
      div.textContent = textFor(line) || "";
      return div;
    }).filter(div => div.textContent));
  }

  async function poll() {
    try {
      const res = await fetch("/api/lines", { cache: "no-store" });
      const data = await res.json();
      if (data.revision !== lastRevision) {
        lastRevision = data.revision;
        render(data.lines);
      }
    } catch (err) {
      /* Server restarting — keep the last frame on screen and retry. */
    }
  }

  poll();
  setInterval(poll, 400);
</script>
</body>
</html>
