<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ language }} subtitles</title>
<link href="/static/fonts/lato.css" rel="stylesheet">
<style>
  /* Transparent background so OBS composites this over the video feed. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  /* Left half of the canvas, full height. Newest line sits at the bottom and
     older lines stack upward, so the reader's eye stays in one place. */
  #subtitles {
    position: absolute;
    left: 0;
    top: 0;
    width: 50vw;
    height: 100vh;
    box-sizing: border-box;
    padding: 3vh 2vw;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    gap: 0.35em;
    overflow: hidden;
    /* CJK faces follow Lato so Chinese renders with real glyphs - Lato has no
       Chinese coverage and would otherwise fall back to boxes. */
    font-family: "Lato", "Helvetica Neue", Helvetica, Arial,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 3.1vh;
    font-weight: 700;
    line-height: 1.3;
    text-align: left;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
  }
  .line {
    background: rgba(0, 0, 0, 0.55);
    padding: 0.2em 0.6em;
    border-radius: 0.3em;
    max-width: 100%;
    animation: fade-in 220ms ease-out;
  }
  /* Older lines recede so the newest is easiest to read. */
  .line.older { opacity: 0.5; font-weight: 400; }
  .line.newest { opacity: 1; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(0.3em); }
    to   { opacity: 1; transform: none; }
  }
  /* Only visible when the page is opened in a normal browser tab, not in OBS. */
  #picker {
    position: absolute;
    top: 0;
    left: 0;
    padding: 0.5rem 0.75rem;
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    border-bottom-right-radius: 6px;
    opacity: 0;
    transition: opacity 150ms;
  }
  #picker:hover, #picker:focus-within { opacity: 1; }
</style>
</head>
<body>
<div id="picker">
  <label>Language
    <select id="language-select"></select>
  </label>
</div>
<div id="subtitles"></div>
<script>
  // "active" means follow whatever the control page selected.
  const PINNED = {{ language | tojson }};
  const FOLLOW_ACTIVE = PINNED === "active";
  const VISIBLE_LINES = {{ visible_lines }};
  // Clear the overlay after a pause, so the last thing said does not stay
  // burned over the rest of the service.
  const CLEAR_AFTER_MS = {{ clear_after_seconds * 1000 }};

  const container = document.getElementById("subtitles");
  const select = document.getElementById("language-select");
  let lastRevision = -1;
  let currentLanguage = FOLLOW_ACTIVE ? null : PINNED;
  let knownLanguages = [];

  function textFor(line, language) {
    return language === "Source" ? line.source : (line.translations || {})[language];
  }

  function render(lines, language) {
    const recent = lines.slice(-VISIBLE_LINES);
    const nodes = recent.map((line, i) => {
      const div = document.createElement("div");
      div.className = i < recent.length - 1 ? "line older" : "line newest";
      div.textContent = textFor(line, language) || "";
      return div;
    }).filter(div => div.textContent);
    container.replaceChildren(...nodes);
  }

  function syncPicker(languages, active) {
    if (languages.join("|") !== knownLanguages.join("|")) {
      knownLanguages = languages;
      select.replaceChildren(...languages.map(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        return option;
      }));
    }
    if (document.activeElement !== select) select.value = active;
  }

  select.addEventListener("change", async () => {
    const language = select.value;
    if (FOLLOW_ACTIVE) {
      // Switch the shared selection so the OBS overlay follows too.
      await fetch("/api/active", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({language}),
      }).catch(() => {});
    } else {
      currentLanguage = language;
      lastRevision = -1;
    }
  });

  let lastChangeAt = Date.now();
  let polling = false;

  async function poll() {
    if (polling) return;   // Don't let a slow response stack up out of order.
    polling = true;
    try {
      const res = await fetch("/api/lines", {cache: "no-store"});
      const data = await res.json();
      const language = FOLLOW_ACTIVE ? data.active : currentLanguage;
      syncPicker(data.languages || [], language);
      if (data.revision !== lastRevision || language !== currentLanguage) {
        lastRevision = data.revision;
        currentLanguage = language;
        lastChangeAt = Date.now();
        render(data.lines, language);
      } else if (CLEAR_AFTER_MS > 0
                 && container.childElementCount
                 && Date.now() - lastChangeAt > CLEAR_AFTER_MS) {
        container.replaceChildren();
      }
    } catch (err) {
      /* Server restarting - keep the last frame on screen and retry. */
    } finally {
      polling = false;
    }
  }

  poll();
  setInterval(poll, 400);
</script>
</body>
</html>
