<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ language }} subtitles</title>
<link href="/static/fonts/lora.css" rel="stylesheet">
<style>
  /* The page stays transparent so the right half of the canvas shows the
     video feed in OBS. Only the subtitle panel paints a background. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
{% if preview %}
  /* Loaded in the control page's preview pane. A transparent document inside
     an iframe renders as white, so stand in for the video with a soft dark
     wash - never sent to OBS. */
  html, body {
    background:
      radial-gradient(120% 90% at 78% 18%, #23252b 0%, transparent 60%),
      linear-gradient(160deg, #17181c 0%, #0e0f12 100%);
  }
{% endif %}
  /* Left half of the canvas, full height. Newest line sits at the bottom and
     older lines stack upward, so the reader's eye stays in one place. */
  #panel {
    position: absolute;
    left: 0;
    top: 0;
    width: 50vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }
  #subtitles {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    padding: 3vh 2vw;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    gap: 0.35em;
    overflow: hidden;
    /* Fade the topmost line into the panel over roughly one line, so lines
       dissolve as they age out instead of ending on a hard edge. */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.5em);
    mask-image: linear-gradient(to bottom, transparent 0, #000 1.5em);
    /* CJK faces follow Lora so Chinese renders with real glyphs - Lora has no
       Chinese coverage and would otherwise fall back to boxes. Songti is the
       serif companion to Lora on macOS; PingFang is the sans fallback. */
    font-family: "Lora", Georgia, "Times New Roman", serif,
                 "Songti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei";
    font-size: 4.4vh;
    font-weight: 600;
    line-height: 1.34;
    letter-spacing: 0.004em;
    text-align: left;
    color: #fff;
  }
  .line {
    max-width: 100%;
    animation: fade-in 220ms ease-out;
  }
  /* Older lines recede so the newest is easiest to read. */
  .line.older { opacity: 0.52; font-weight: 500; }
  .line.newest { opacity: 1; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(0.3em); }
    to   { opacity: 1; transform: none; }
  }
  /* Only visible when the page is opened in a normal browser tab, not in OBS. */
  #picker {
    position: absolute;
    top: 0;
    left: 0;
    padding: 0.5rem 0.75rem;
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    border-bottom-right-radius: 6px;
    opacity: 0;
    transition: opacity 150ms;
  }
  #picker:hover, #picker:focus-within { opacity: 1; }
</style>
</head>
<body>
<div id="picker">
  <label>Language
    <select id="language-select"></select>
  </label>
</div>
<div id="panel"><div id="subtitles"></div></div>
<script>
  // "active" means follow whatever the control page selected.
  const PINNED = {{ language | tojson }};
  const FOLLOW_ACTIVE = PINNED === "active";
  // Display settings arrive with each poll, so the control page can change
  // them mid-service without a reload.
  let visibleLines = 8;
  let clearAfterMs = 12000;

  const container = document.getElementById("subtitles");
  const select = document.getElementById("language-select");
  let lastRevision = -1;
  let currentLanguage = FOLLOW_ACTIVE ? null : PINNED;
  let knownLanguages = [];

  function textFor(line, language) {
    return language === "Source" ? line.source : (line.translations || {})[language];
  }

  function render(lines, language) {
    const recent = lines.slice(-visibleLines);
    const nodes = recent.map((line, i) => {
      const div = document.createElement("div");
      div.className = i < recent.length - 1 ? "line older" : "line newest";
      div.textContent = textFor(line, language) || "";
      return div;
    }).filter(div => div.textContent);
    container.replaceChildren(...nodes);

    // The panel is bottom-anchored with overflow hidden, so anything taller
    // than the canvas gets sliced through the middle of the oldest line.
    // Drop whole lines from the top until what remains fits, keeping the
    // newest line even if it alone overflows.
    while (container.scrollHeight > container.clientHeight
           && container.childElementCount > 1) {
      container.removeChild(container.firstElementChild);
    }
  }

  function syncPicker(languages, active) {
    if (languages.join("|") !== knownLanguages.join("|")) {
      knownLanguages = languages;
      select.replaceChildren(...languages.map(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        return option;
      }));
    }
    if (document.activeElement !== select) select.value = active;
  }

  select.addEventListener("change", async () => {
    const language = select.value;
    if (FOLLOW_ACTIVE) {
      // Switch the shared selection so the OBS overlay follows too.
      await fetch("/api/active", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({language}),
      }).catch(() => {});
    } else {
      currentLanguage = language;
      lastRevision = -1;
    }
  });

  let lastChangeAt = Date.now();
  let polling = false;

  async function poll() {
    if (polling) return;   // Don't let a slow response stack up out of order.
    polling = true;
    try {
      const res = await fetch("/api/lines", {cache: "no-store"});
      const data = await res.json();
      const language = FOLLOW_ACTIVE ? data.active : currentLanguage;
      syncPicker(data.languages || [], language);

      const s = data.settings || {};
      if (s.FONT_SIZE_VH) container.style.fontSize = s.FONT_SIZE_VH + "vh";
      if (s.VISIBLE_LINES && s.VISIBLE_LINES !== visibleLines) {
        visibleLines = s.VISIBLE_LINES;
        render(data.lines, language);       // Re-render at the new line count.
      }
      if (s.CLEAR_SUBTITLES_AFTER_SECONDS !== undefined)
        clearAfterMs = s.CLEAR_SUBTITLES_AFTER_SECONDS * 1000;
      if (data.revision !== lastRevision || language !== currentLanguage) {
        lastRevision = data.revision;
        currentLanguage = language;
        lastChangeAt = Date.now();
        render(data.lines, language);
      } else if (clearAfterMs > 0
                 && container.childElementCount
                 && Date.now() - lastChangeAt > clearAfterMs) {
        container.replaceChildren();
      }
    } catch (err) {
      /* Server restarting - keep the last frame on screen and retry. */
    } finally {
      polling = false;
    }
  }

  poll();
  setInterval(poll, 400);
</script>
</body>
</html>
